<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Document Sheet in Background -->
  <g transform="translate(136, 110)">
    <rect x="0" y="0" width="240" height="292" rx="28" fill="url(#docGrad)" stroke="#334155" stroke-width="4" />
    <!-- Folded Corner -->
    <path d="M 176 0 L 240 64 L 176 64 Z" fill="#334155" />
    <path d="M 176 0 L 240 64 L 240 0 Z" fill="#0b1120" />
    
    <!-- Document Lines -->
    <rect x="36" y="90" width="168" height="12" rx="6" fill="#3b82f6" opacity="0.4" />
    <rect x="36" y="122" width="120" height="12" rx="6" fill="#3b82f6" opacity="0.3" />
    <rect x="36" y="154" width="148" height="12" rx="6" fill="#3b82f6" opacity="0.3" />
    <rect x="36" y="186" width="100" height="12" rx="6" fill="#3b82f6" opacity="0.2" />
  </g>

  <!-- Foreground Lightning / Spark Forge Icon -->
  <g filter="url(#glow)">
    <polygon points="276,140 186,280 256,280 236,372 326,232 256,232" fill="url(#boltGrad)" />
  </g>

  <!-- Sparkles -->
  <g fill="#38bdf8">
    <path d="M 370 120 Q 370 135 385 135 Q 370 135 370 150 Q 370 135 355 135 Q 370 135 370 120 Z" />
    <path d="M 120 340 Q 120 352 132 352 Q 120 352 120 364 Q 120 352 108 352 Q 120 352 120 340 Z" opacity="0.8" />
  </g>
</svg>
