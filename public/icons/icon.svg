<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Badge Background Gradients -->
    <linearGradient id="badgeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Primary Top Origami Blade (Cyan to Electric Blue) -->
    <linearGradient id="bladeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Vertical Anvil Pillar (Deep Indigo / Violet) -->
    <linearGradient id="pillarLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Forge Heat Crossbar (Neon Magenta to Orange Fire) -->
    <linearGradient id="forgeHeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- 3D Isometric Shadow Overlay -->
    <linearGradient id="facetShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Core Spark Glow Filter -->
    <filter id="logoSparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="24" y="24" width="464" height="464" rx="136" fill="#06b6d4" opacity="0.15" filter="url(#logoSparkGlow)" />

  <!-- Outer Hex-Squircle Shield Container -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="136"
    fill="url(#badgeBase)"
    stroke="url(#badgeBorder)"
    stroke-width="14"
  />

  <!-- Subtle Internal Geometric Grid Lines -->
  <path
    d="M 96 256 H 416 M 256 96 V 416"
    stroke="rgba(255, 255, 255, 0.05)"
    stroke-width="3"
    stroke-dasharray="12 18"
  />

  <!-- --- 3D FORGED 'F' MONOGRAM RIBBONS --- -->

  <!-- 1. Left Vertical Pillar (Anvil spine) -->
  <path
    d="M 136 120 C 136 106.7 146.7 96 160 96 H 208 V 384 C 208 397.3 197.3 408 184 408 H 160 C 146.7 408 136 397.3 136 384 Z"
    fill="url(#pillarLeft)"
  />

  <!-- 2. Top Horizontal Forging Arm (Angular Arrow / Prism Header) -->
  <path
    d="M 184 96 H 368 C 381.3 96 389.9 109.2 384.5 121.4 L 358.4 180 C 354.8 188.2 346.7 193.4 337.8 193.4 H 184 V 96 Z"
    fill="url(#bladeTop)"
  />

  <!-- 3. Top Specular Bevel Accent -->
  <path
    d="M 192 104 H 364 L 350 136 H 192 Z"
    fill="rgba(255, 255, 255, 0.35)"
  />

  <!-- 4. Middle Forge Heat Ribbon (Glowing Magenta-Orange transformation bar) -->
  <path
    d="M 184 220 H 312 C 325.3 220 333.9 233.2 328.5 245.4 L 308.8 289.6 C 305.2 297.8 297.1 303 288.2 303 H 184 V 220 Z"
    fill="url(#forgeHeat)"
  />

  <!-- 5. Isometric Shadow Fold connecting Pillar & Ribbons -->
  <path
    d="M 184 96 L 208 120 V 384 L 184 408 Z"
    fill="url(#facetShadow)"
    opacity="0.6"
  />

  <!-- 6. Glowing Quantum Core Diamond Spark -->
  <g filter="url(#logoSparkGlow)">
    <polygon
      points="368,96 392,128 368,160 344,128"
      fill="#a5f3fc"
    />
    <circle
      cx="368"
      cy="128"
      r="10"
      fill="#ffffff"
    />
  </g>
</svg>
