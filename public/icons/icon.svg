<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Radial Space Background -->
    <radialGradient id="spaceBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#080c14" />
      <stop offset="85%" stop-color="#04060c" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <!-- Ambient Core Plasma Halo -->
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Squircle Ring Border -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Top Laser Blade (Cyan -> Electric Blue) -->
    <linearGradient id="bladeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Left Anvil Spine (Electric Violet -> Indigo) -->
    <linearGradient id="pillarLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Forge Plasma Crossbar (Hot Pink -> Amber Gold) -->
    <linearGradient id="forgeHeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- 3D Isometric Crease Shadow -->
    <linearGradient id="creaseShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Core Spark Glow Filter -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. FULL BLEED BACKGROUND (Ensures 100% Android Maskable compliance) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#spaceBg)" />

  <!-- 2. AMBIENT RADIANT CORE PLASMA -->
  <circle cx="256" cy="256" r="230" fill="url(#plasmaGlow)" />

  <!-- 3. CYBERNETIC RADAR / ORBITAL DEPTH RINGS (Subtle tech blueprint) -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="rgba(6, 182, 212, 0.08)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="125" fill="none" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1" stroke-dasharray="4 6" />

  <!-- 4. INNER 3D SHIELD GLOW (Safe-zone framing) -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="124"
    fill="none"
    stroke="url(#shieldBorder)"
    stroke-width="5"
    opacity="0.45"
  />

  <!-- 5. --- 3D FORGED 'F' MONOGRAM RIBBONS --- -->

  <!-- Left Anvil Spine -->
  <path
    d="M 124 140 C 124 124 136 112 152 112 H 198 V 376 C 198 392 186 404 170 404 H 152 C 136 404 124 392 124 376 Z"
    fill="url(#pillarLeft)"
  />

  <!-- Top Laser Origami Arm -->
  <path
    d="M 186 112 H 360 C 375 112 386 126 380 140 L 350 206 C 345 216 335 222 324 222 H 186 V 112 Z"
    fill="url(#bladeTop)"
  />

  <!-- Top Specular Chrome Bevel Light -->
  <path
    d="M 194 120 H 356 L 340 152 H 194 Z"
    fill="rgba(255, 255, 255, 0.45)"
  />

  <!-- Middle Forge Heat Plasma Bar -->
  <path
    d="M 186 244 H 304 C 318 244 329 258 323 272 L 302 318 C 297 328 287 334 276 334 H 186 V 244 Z"
    fill="url(#forgeHeat)"
    filter="url(#softGlow)"
  />
  <path
    d="M 186 244 H 304 C 318 244 329 258 323 272 L 302 318 C 297 328 287 334 276 334 H 186 V 244 Z"
    fill="url(#forgeHeat)"
  />

  <!-- Isometric Shadow Fold -->
  <path
    d="M 186 112 L 198 126 V 376 L 186 404 Z"
    fill="url(#creaseShadow)"
    opacity="0.8"
  />

  <!-- 6. HYPER-SPARK DIAMOND (Forge Core Nova) -->
  <g filter="url(#intenseGlow)">
    <!-- 4-point radiant star -->
    <path
      d="M 360 84 Q 360 112 388 112 Q 360 112 360 140 Q 360 112 332 112 Q 360 112 360 84 Z"
      fill="#e0f2fe"
    />
    <circle cx="360" cy="112" r="6" fill="#ffffff" />
  </g>
</svg>
